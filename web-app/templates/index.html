<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        h3 {
            text-align: center;
            color: #6B7280;
            font-weight: 500;
            margin-bottom: 30px;
        }

        p {
            color: #4B5563;
            margin-bottom: 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            padding: 16px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        textarea:focus {
            border-color: #FB923C;
            box-shadow: 0 0 0 4px rgba(251, 146, 60, 0.15);
        }

        button {
            background: #FB923C;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #F97316;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #summary-output {
            margin-top: 24px;
            padding: 20px;
            border-radius: 14px;
            background: #FFF7ED;
            border: 1px solid #FED7AA;
        }

        #summary-heading {
            margin: 0 0 12px 0;
            color: #9A3412;
            font-size: 1.05rem;
        }

        #summary-text {
            color: #374151;
            line-height: 1.7;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1> Text Summarizer</h1>
        <h3>Fine-Tuned T5 Transformer</h3>
        <p>Write or Paste your content below for quick summarization.</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div id="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");

            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;

            summaryText.innerText = "Processing...";
            submitButton.disabled = true;

            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {

                summaryText.innerText = `Error: ${err.message}`;
            } finally {

                submitButton.disabled = false;
            }
        });
    </script>
</body>

</html>
